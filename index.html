<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎰 Казино</title>
    <script src="https://telegram.org/js/telegram-web-app.js?56"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0b0b1a; color: #fff; font-family: Arial, sans-serif; padding: 16px; padding-bottom: 90px; }
        .container { max-width: 400px; margin: 0 auto; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a1a2e;
            padding: 14px 18px;
            border-radius: 16px;
            border: 1px solid #ffd700;
            margin-bottom: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        .header:active { transform: scale(0.98); }
        .header .title { font-size: 18px; font-weight: bold; color: #ffd700; }
        .header .balance { font-size: 22px; font-weight: bold; color: #ffd700; }
        .menu {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .menu button {
            flex: 1;
            padding: 10px;
            background: #1a1a2e;
            border: 1px solid #333;
            border-radius: 12px;
            color: #aaa;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }
        .menu button.active { background: #ffd700; color: #0b0b1a; border-color: #ffd700; }
        .game-box { background: #12121f; border-radius: 20px; padding: 20px; min-height: 220px; }
        .reels {
            font-size: 48px;
            text-align: center;
            padding: 16px;
            background: #0a0a14;
            border-radius: 14px;
            border: 1px solid #333;
            letter-spacing: 12px;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 12px;
        }
        .btn:active { transform: scale(0.96); }
        .btn-gold { background: linear-gradient(45deg, #ffd700, #f0a500); color: #0b0b1a; }
        .btn-blue { background: linear-gradient(45deg, #00ccff, #0066ff); color: #fff; }
        .btn-green { background: linear-gradient(45deg, #44ff44, #00aa00); color: #0b0b1a; }
        .btn-red { background: linear-gradient(45deg, #ff4444, #cc0000); color: #fff; }
        .btn-purple { background: linear-gradient(45deg, #aa44ff, #6600cc); color: #fff; }
        .hidden { display: none !important; }
        .bottom-nav {
            position: fixed;
            bottom: 10px;
            left: 10px;
            right: 10px;
            max-width: 400px;
            margin: 0 auto;
            background: #1a1a2e;
            border-radius: 20px;
            display: flex;
            padding: 8px;
            gap: 4px;
            border: 1px solid #333;
        }
        .bottom-nav button {
            flex: 1;
            padding: 8px 0;
            background: transparent;
            border: none;
            color: #888;
            font-size: 11px;
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
        }
        .bottom-nav button .icon { font-size: 20px; display: block; }
        .bottom-nav button.active { background: rgba(255, 215, 0, 0.15); color: #ffd700; }
        .debug {
            background: #1a1a2e;
            padding: 10px;
            border-radius: 10px;
            margin-top: 10px;
            font-size: 12px;
            color: #aaa;
            border: 1px solid #333;
            word-break: break-all;
        }
        .dev-panel {
            background: #0a0a1a;
            padding: 12px;
            border-radius: 12px;
            margin-top: 12px;
            border: 1px solid #aa44ff;
            display: none;
        }
        .dev-panel.active {
            display: block;
        }
        .dev-panel .dev-title {
            color: #aa44ff;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
        }
        .dev-panel .dev-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        .dev-panel .dev-buttons button {
            padding: 8px;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .dev-panel .dev-buttons button:active { transform: scale(0.95); }
    </style>
</head>
<body>

<div class="container">
    <div class="header" id="headerTap">
        <span class="title">🎰 КАЗИНО</span>
        <span class="balance" id="balanceDisplay">💰 10</span>
    </div>

    <div class="menu" id="gameMenu">
        <button class="active" data-game="slot">🎰 Слот</button>
        <button data-game="shop">🛒 Магазин</button>
    </div>

    <div class="game-box" id="gameArea">
        <div id="slotGame">
            <div class="reels" id="slotReels">🍒 🍋 ⭐</div>
            <button class="btn btn-gold" id="spinBtn">КРУТИТЬ (1 монета)</button>
            <button class="btn btn-blue" id="buyCoinsBtn">⭐ КУПИТЬ 100 МОНЕТ ЗА 10 STARS</button>
        </div>

        <div id="shopGame" class="hidden">
            <h3 style="color:#ffd700;text-align:center;margin-bottom:12px;">🛒 МАГАЗИН СКИНОВ</h3>
            <p style="text-align:center;color:#aaa;font-size:14px;margin-bottom:12px;">Купи скин за Stars</p>
            <button class="btn btn-blue" id="buyCoinsBtnShop">⭐ КУПИТЬ 100 МОНЕТ ЗА 10 STARS</button>
        </div>

        <div id="debugPanel" class="debug hidden">
            <b>📡 Отладка:</b><br>
            <span id="debugText">Ожидание...</span>
        </div>

        <!-- РЕЖИМ РАЗРАБОТЧИКА -->
        <div class="dev-panel" id="devPanel">
            <div class="dev-title">🛠️ РЕЖИМ РАЗРАБОТЧИКА</div>
            <div class="dev-buttons">
                <button class="btn-green" id="devAdd100">➕ +100</button>
                <button class="btn-green" id="devAdd1000">➕ +1000</button>
                <button class="btn-blue" id="devAdd5000">➕ +5000</button>
                <button class="btn-purple" id="devTestWithdraw">⭐ Тест вывода</button>
                <button class="btn-red" id="devReset">🔄 Сброс до 10</button>
                <button class="btn-gold" id="devHide">❌ Скрыть</button>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <button class="active" data-tab="game"><span class="icon">🎰</span>Игры</button>
        <button id="withdrawBtn"><span class="icon">⭐</span>Вывод</button>
    </div>
</div>

<script>
    // ============================================================
    // ===== НАСТРОЙКИ =====
    // ============================================================
    const SERVER_URL = 'https://casino-banked.onrender.com';
    const PAYMENT_TOKEN = '';
    const BOT_TOKEN = '8996479997:AAGgI3ZEC5-58UCr09iFfNJMYxZU7ZgVhKs';
    const OWNER_ID = 6854669649;

    const webApp = window.Telegram.WebApp;
    webApp.ready();

    let balance = 10;

    // ============================================================
    // ===== РЕЖИМ РАЗРАБОТЧИКА =====
    // ============================================================
    let devMode = false;
    let tapCount = 0;
    let tapTimer = null;

    function toggleDevMode() {
        devMode = !devMode;
        const panel = document.getElementById('devPanel');
        if (devMode) {
            panel.classList.add('active');
            webApp.showAlert('🛠️ Режим разработчика включён!');
        } else {
            panel.classList.remove('active');
            webApp.showAlert('🛠️ Режим разработчика выключен');
        }
    }

    // Активация по 5 нажатиям на шапку
    document.getElementById('headerTap').addEventListener('click', function() {
        tapCount++;
        clearTimeout(tapTimer);
        tapTimer = setTimeout(() => { tapCount = 0; }, 2000);
        if (tapCount >= 5) {
            tapCount = 0;
            toggleDevMode();
        }
    });

    // ============================================================
    // ===== ДЕВ-ФУНКЦИИ =====
    // ============================================================
    document.getElementById('devAdd100').addEventListener('click', function() {
        const newBalance = balance + 100;
        setBalance(newBalance);
        webApp.showAlert('➕ +100 монет! Баланс: ' + newBalance);
    });

    document.getElementById('devAdd1000').addEventListener('click', function() {
        const newBalance = balance + 1000;
        setBalance(newBalance);
        webApp.showAlert('➕ +1000 монет! Баланс: ' + newBalance);
    });

    document.getElementById('devAdd5000').addEventListener('click', function() {
        const newBalance = balance + 5000;
        setBalance(newBalance);
        webApp.showAlert('➕ +5000 монет! Баланс: ' + newBalance);
    });

    document.getElementById('devReset').addEventListener('click', function() {
        setBalance(10);
        webApp.showAlert('🔄 Баланс сброшен до 10');
    });

    document.getElementById('devTestWithdraw').addEventListener('click', function() {
        if (balance < 100) {
            webApp.showAlert('❌ Добавь монет сначала (у тебя ' + balance + ')');
            return;
        }
        const msg = '🧪 ТЕСТОВАЯ ЗАЯВКА (режим разработчика)\n\n' +
                    '👤 Разработчик: @' + (webApp.initDataUnsafe?.user?.username || 'тест') + '\n' +
                    '💰 Монет: ' + balance + '\n' +
                    '⭐ Stars: ' + Math.floor(balance / 10) + '\n' +
                    '📅 Время: ' + new Date().toLocaleString();

        fetch('https://api.telegram.org/bot' + BOT_TOKEN + '/sendMessage', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: OWNER_ID, text: msg, parse_mode: 'HTML' })
        })
        .then(r => r.json())
        .then(result => {
            if (result.ok) {
                webApp.showAlert('✅ Тестовая заявка отправлена!');
            } else {
                webApp.showAlert('❌ Ошибка: ' + JSON.stringify(result));
            }
        })
        .catch(() => {
            webApp.showAlert('❌ Ошибка отправки');
        });
    });

    document.getElementById('devHide').addEventListener('click', function() {
        devMode = false;
        document.getElementById('devPanel').classList.remove('active');
        webApp.showAlert('🛠️ Режим разработчика скрыт');
    });

    // ============================================================
    // ===== БАЛАНС =====
    // ============================================================
    function updateBalanceUI() {
        document.getElementById('balanceDisplay').textContent = '💰 ' + balance;
    }

    async function setBalance(newBalance) {
        balance = newBalance;
        updateBalanceUI();
        try {
            await fetch(SERVER_URL + '/update-balance', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ telegramId: 'test', newBalance })
            });
        } catch (e) {}
    }

    function debug(msg) {
        const panel = document.getElementById('debugPanel');
        panel.classList.remove('hidden');
        document.getElementById('debugText').textContent = msg;
        console.log('🔍 DEBUG:', msg);
    }

    // ===== СЛОТ =====
    const slotEmojis = ['🍒', '🍋', '🍊', '⭐', '7️⃣', '💎'];

    function spinSlot() {
        if (balance < 1) {
            webApp.showAlert('❌ Нет монет! Купи за Stars.');
            return;
        }

        const reels = document.getElementById('slotReels');
        const result = [];
        for (let i = 0; i < 3; i++) {
            result.push(slotEmojis[Math.floor(Math.random() * slotEmojis.length)]);
        }
        reels.textContent = result.join(' ');

        let win = 0;
        if (result[0] === result[1] && result[1] === result[2]) {
            win = 5;
        } else if (result[0] === result[1] || result[1] === result[2] || result[0] === result[2]) {
            win = 2;
        }

        const newBalance = balance - 1 + win;
        setBalance(newBalance);

        if (win > 0) {
            webApp.showAlert('🎉 Выигрыш: +' + win + ' монет!');
        }
    }

    // ===== ПОКУПКА МОНЕТ =====
    function buyCoins() {
        webApp.openInvoice({
            title: 'Пополнение',
            description: '100 монет',
            payload: 'coins_100_' + Date.now(),
            provider_token: PAYMENT_TOKEN,
            currency: 'XTR',
            prices: [{ label: '100 монет', amount: 10 }]
        });
    }

    webApp.onEvent('invoiceClosed', function(data) {
        if (data.status === 'paid') {
            setBalance(balance + 100);
            webApp.showAlert('✅ 100 монет зачислено!');
        } else if (data.status === 'cancelled') {
            webApp.showAlert('❌ Отмена');
        }
    });

    // ===== ВЫВОД =====
    function openWithdraw() {
        debug('🔹 Нажата кнопка "Вывод"');
        debug('Баланс: ' + balance);

        if (balance < 100) {
            debug('❌ Баланс меньше 100');
            webApp.showAlert(
                '❌ Недостаточно монет!\n\n' +
                'Минимальный вывод — 100 монет (10 Stars).\n' +
                'У вас: ' + balance + ' монет.\n\n' +
                '💡 Накопите 100 монет или купите их за Stars.'
            );
            return;
        }

        debug('✅ Баланс OK (>= 100)');

        let username = 'без юзернейма';
        try {
            const user = webApp.initDataUnsafe?.user;
            if (user && user.username) {
                username = '@' + user.username;
            } else if (user && user.id) {
                username = 'ID: ' + user.id;
            }
        } catch (e) {}

        const stars = Math.floor(balance / 10);
        const msg = '⭐ ЗАЯВКА НА ВЫВОД STARS\n\n' +
                    '👤 Игрок: ' + username + '\n' +
                    '💰 Монет: ' + balance + '\n' +
                    '⭐ Stars: ' + stars + '\n' +
                    '📅 Время: ' + new Date().toLocaleString();

        debug('📨 Отправка сообщения...');

        const url = 'https://api.telegram.org/bot' + BOT_TOKEN + '/sendMessage';
        const data = {
            chat_id: OWNER_ID,
            text: msg,
            parse_mode: 'HTML'
        };

        fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        })
        .then(response => {
            debug('📨 Ответ получен, статус: ' + response.status);
            if (!response.ok) throw new Error('HTTP ' + response.status);
            return response.json();
        })
        .then(result => {
            debug('📨 Результат: ' + JSON.stringify(result));
            if (result.ok) {
                webApp.showAlert('✅ Заявка на вывод отправлена! Ожидайте перевода.');
            } else {
                webApp.showAlert('❌ Ошибка отправки');
            }
        })
        .catch(error => {
            debug('❌ Ошибка: ' + error.message);
            webApp.showAlert('❌ Ошибка отправки заявки.');
        });
    }

    // ===== НАВИГАЦИЯ =====
    function switchGame(game) {
        document.querySelectorAll('.menu button').forEach(b => b.classList.remove('active'));
        document.querySelector('.menu button[data-game="' + game + '"]')?.classList.add('active');

        document.getElementById('slotGame').classList.toggle('hidden', game !== 'slot');
        document.getElementById('shopGame').classList.toggle('hidden', game !== 'shop');
        document.getElementById('debugPanel').classList.add('hidden');
    }

    // ===== ЗАПУСК =====
    function init() {
        updateBalanceUI();

        document.getElementById('spinBtn').addEventListener('click', spinSlot);
        document.getElementById('buyCoinsBtn').addEventListener('click', buyCoins);
        document.getElementById('buyCoinsBtnShop').addEventListener('click', buyCoins);
        document.getElementById('withdrawBtn').addEventListener('click', openWithdraw);

        document.querySelectorAll('.menu button').forEach(b => {
            b.addEventListener('click', function() { switchGame(this.dataset.game); });
        });

        switchGame('slot');

        console.log('✅ Приложение запущено!');
        console.log('🛠️ Чтобы включить режим разработчика — нажми 5 раз на шапку с балансом.');
    }

    init();
</script>

</body>
</html>
